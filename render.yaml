# Render Blueprint: one Node web service that runs the Socket.IO server
# and also serves the built client (so the game works from this URL alone).
services:
  - type: web
    name: in-a-grove
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Comma-separated browser origins allowed to connect, e.g. https://in-a-grove.vercel.app
      # Leave unset to allow any origin.
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      # Signs login tokens; keep it stable or everyone is logged out.
      - key: SESSION_SECRET
        generateValue: true
      # Shared mail relay (oink-kit's oink-mail on Vercel), e.g. https://oink-mail.vercel.app/api/send-code
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      # Emails allowed to open cases, comma-separated. Empty = anyone who logs in.
      - key: HOST_EMAILS
        sync: false
